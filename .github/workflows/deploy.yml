
name: Sync Blogs to Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-blogs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install @supabase/supabase-js front-matter glob

    - name: Sync blogs
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        node -e "
        const { createClient } = require('@supabase/supabase-js');
        const fs = require('fs').promises;
        const path = require('path');
        const frontMatter = require('front-matter');
        const glob = require('glob');

        const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_KEY);
        const BASE = \`https://raw.githubusercontent.com/\${process.env.GITHUB_REPOSITORY}/main\`;

        (async () => {
          const files = glob.sync('*/README.md', { ignore: ['.github/**', 'node_modules/**'] });
          console.log(\`📚 Found \${files.length} blogs\`);
          
          for (const file of files) {
            const folder = path.dirname(file);
            const content = await fs.readFile(file, 'utf-8');
            const { attributes, body } = frontMatter(content);
            
            const title = attributes.title || folder.replace(/-/g, ' ');
            const slug = folder.toLowerCase().replace(/[^a-z0-9-]/g, '-');
            
            const blogData = {
              title,
              excerpt: attributes.excerpt || '',
              content: body,
              date: attributes.date || new Date().toISOString().split('T')[0],
              read_time: \`\${Math.ceil(body.split(/\s+/).length / 200)} min read\`,
              tags: JSON.stringify(attributes.tags || []),
              featured: attributes.featured || false,
              slug,
              status: attributes.status || 'published',
              updated_at: new Date().toISOString()
            };
            
            const { error } = await supabase.from('blogs').upsert(blogData, { onConflict: 'slug' });
            if (error) console.error('❌', error);
            else console.log('✅', title);
          }
        })();
        "
